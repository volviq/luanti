name: android

# build on c/cpp changes or workflow changes
on:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gettext
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
          distribution: 'temurin'
          java-version: '17'
    - name: Build AAB with Gradle
      # We build an AAB as well for uploading to the the Play Store.
      run: cd android; ./gradlew bundlerelease
    - name: Build APKs with Gradle
      # "assemblerelease" is very fast after "bundlerelease".
      run: cd android; ./gradlew assemblerelease
    - name: Save AAB artifact
      uses: actions/upload-artifact@v7
      with:
        name: Luanti-release.aab
        path: android/app/build/outputs/bundle/release/app-release.aab
    - name: Save armeabi artifact
      uses: actions/upload-artifact@v7
      with:
        name: Luanti-armeabi-v7a.apk
        path: android/app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    - name: Save arm64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: Luanti-arm64-v8a.apk
        path: android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
    - name: Save x86 artifact
      uses: actions/upload-artifact@v7
      with:
        name: Luanti-x86.apk
        path: android/app/build/outputs/apk/release/app-x86-release-unsigned.apk
    - name: Save x86_64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: Luanti-x86_64.apk
        path: android/app/build/outputs/apk/release/app-x86_64-release-unsigned.apk
    - name: Publish test release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Sign like F-Droid does: an unminified release build signed afterwards
        out=android/app/build/outputs/apk/release
        bt=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
        for abi in armeabi-v7a arm64-v8a; do
          $bt/zipalign -f -p 4 $out/app-$abi-release-unsigned.apk aligned-$abi.apk
          $bt/apksigner sign --ks android/gamepad-test.jks --ks-key-alias test \
            --ks-pass pass:testtest --key-pass pass:testtest \
            --out luanti-gamepad-test-$abi.apk aligned-$abi.apk
        done
        gh release view gamepad-test >/dev/null 2>&1 || gh release create gamepad-test \
          --prerelease --target "$GITHUB_SHA" --title "Gamepad menu cursor (test build)" \
          --notes "Test build of the gamepad menu cursor. Installs next to the normal Luanti app."
        gh release upload gamepad-test luanti-gamepad-test-armeabi-v7a.apk luanti-gamepad-test-arm64-v8a.apk --clobber
